name: Crypto Engine-Specific Factor Tuning (Frozen SL-RR)
on:
  push:
    branches: [research/crypto-engine-factor-tuning-5y]
    paths:
      - "research/crypto_engine_factor_tuning_5y.py"
      - ".github/workflows/crypto-engine-factor-tuning-5y.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor-tuning:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy requests
      - name: Run engine-specific factor scan and untouched holdout validation
        run: python research/crypto_engine_factor_tuning_5y.py
      - name: Upload factor tuning results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-engine-factor-tuning-five-year
          path: crypto-engine-factor-tuning-results/
          if-no-files-found: error
          retention-days: 90
