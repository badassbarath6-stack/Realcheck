name: Crypto Engine Secondary and Tertiary Factor Search (Frozen SL-RR)
on:
  push:
    branches: [research/crypto-engine-secondary-tertiary-factors, research/crypto-factor-audit-fix]
    paths:
      - "research/crypto_engine_secondary_tertiary_factors.py"
      - ".github/workflows/crypto-engine-secondary-tertiary-factors.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor-search:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy requests
      - name: Compile Python runner
        run: python -m py_compile research/crypto_engine_secondary_tertiary_factors.py
      - name: Run secondary and tertiary factor research
        run: python research/crypto_engine_secondary_tertiary_factors.py
      - name: Upload factor research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-engine-secondary-tertiary-factor-results
          path: crypto-engine-factor-tuning-results/
          if-no-files-found: error
          retention-days: 90
