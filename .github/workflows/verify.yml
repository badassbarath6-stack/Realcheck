name: Verify Impulse Retracer
on:
  push:
    branches:
      - fix/top100-single-alert-architecture
      - research/mtf-top100-two-year
    paths:
      - "cloudflare/**"
      - "config/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/verify.yml"
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
