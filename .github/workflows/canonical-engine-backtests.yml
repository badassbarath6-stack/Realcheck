name: Canonical direct-OHLCV engine backtests
on:
  push:
    branches:
      - research/crypto-5y-source-backtests
    paths:
      - "research/engine_audit/canonical_python_direct_candidates.csv"
      - "research/engine_audit/run_canonical_candidate_backtests.py"
      - ".github/workflows/canonical-engine-backtests.yml"
permissions:
  contents: read
  actions: read
jobs:
  canonical-python-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-5y-source-backtests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve immutable 1,000-source harvest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/harvest-download source-harvest
          gh run download 45023349418 --repo badassbarath6-stack/Realcheck --name strategy-source-harvest-1000 --dir /tmp/harvest-download
          cp -a /tmp/harvest-download/. source-harvest/
          test "$(find source-harvest/sources -type f | wc -l)" -eq 1000
          test -f source-harvest/manifest.csv
      - name: Install Freqtrade and common source dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install freqtrade pyarrow ta technical scikit-learn scipy statsmodels
          freqtrade --version
      - name: Build checksum-verified five-year Binance USD-M OHLCV data
        run: |
          python research/engine_audit/download_binance_vision_futures.py
          test -s five-year-results/data_manifest.json
          find user_data/data/binance/futures -type f -name '*.feather' | sort
      - name: Validate candidate set and execute canonical direct-OHLCV engines
        run: |
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('research/engine_audit/canonical_python_direct_candidates.csv')))
          assert len(rows)==99, len(rows)
          assert len({r['engine_id'] for r in rows})==99
          assert all(r['timeframe'] in {'5m','15m','30m','1h','4h'} for r in rows)
          print('Validated 99 unique canonical direct-OHLCV candidates')
          PY
          python research/engine_audit/run_canonical_candidate_backtests.py
      - name: Publish complete results and native backtest files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realcheck-canonical-direct-ohclv-five-year-results
          path: |
            canonical-five-year-results/
            five-year-results/data_manifest.json
          if-no-files-found: warn
          retention-days: 90
