name: Impulse Retracer Top-100 Five-Year Backtest

on:
  pull_request:
    branches: [main]
    paths:
      - "config/strategies.js"
      - "cloudflare/src/worker.js"
      - "config/pf-rankings.js"
      - "backtest/top100_five_year_h1_m1.py"
      - ".github/workflows/top100-five-year-backtest.yml"
      - "tests/impulse-retracer.test.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: impulse-retracer-top100-five-year
  cancel-in-progress: false

jobs:
  five-year-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Verify live engine tests
        run: |
          npm test
          npm run check
      - name: Validate five-year backtest runner
        run: python -m py_compile backtest/top100_five_year_h1_m1.py
      - name: Run five-year BTC and ETH Top-100 replay
        run: python backtest/top100_five_year_h1_m1.py --start 2021-11-19 --end 2026-11-19
      - name: Publish validated historical PF registry to the branch
        if: success()
        run: |
          cp backtest-results-top100-5y/pf-rankings.js config/pf-rankings.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/pf-rankings.js
          if ! git diff --cached --quiet; then
            git commit -m "Add PF rankings validated by five-year Top-100 replay"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Upload five-year research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impulse-retracer-top100-five-year-results
          path: |
            backtest-results-top100-5y/
            .backtest-cache-top100/
          if-no-files-found: warn
          retention-days: 30
