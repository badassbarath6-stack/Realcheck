name: Model 3-100 BTC three-year H1-to-M1 backtest
on:
  push:
    paths:
      - 'backtest/model3_100_1m_execution.py'
      - 'Model_3-100_Google_Apps_Script.gs'
      - '.github/workflows/model3-100-1m-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model3-100-three-year-h1-m1
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 3-year H1 impulse / M1 execution replay
        run: python backtest/model3_100_1m_execution.py
      - name: Upload verified results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model3-100-btc-3y-h1-signal-m1-execution
          path: |
            summary.json
            trades.csv
            per_config.csv
          if-no-files-found: warn
          retention-days: 90
