name: Crypto 10 Engine Three Year Backtest
on:
  push:
    branches: [research/crypto-10-engine-3y]
    paths:
      - "research/crypto_10_engine_backtest.py"
      - ".github/workflows/crypto-10-engine-3y.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy requests
      - name: Run ten independent strategy backtests
        run: python research/crypto_10_engine_backtest.py
      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-10-engine-three-year-results
          path: crypto-10-engine-results/
          if-no-files-found: error
          retention-days: 90
