name: Three-Year 100-Point Retracement Backtest
on:
  push:
    branches:
      - research/retracement-100-three-year
    paths:
      - "research/retracement_1000_three_year_backtest.py"
      - "research/aggregate_retracement_1000.py"
      - ".github/workflows/retracement-1000-three-year.yml"
  workflow_dispatch:
concurrency:
  group: retracement-1000-three-year
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mtf-top100-two-year
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile new runner
        run: python -m py_compile research/retracement_1000_three_year_backtest.py research/aggregate_retracement_1000.py
      - name: Existing research tests
        run: python -m unittest discover -s tests/research -v
      - name: Verify exactly 100 retracement values
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "research")
          import retracement_1000_three_year_backtest as m
          assert len(m.RETRACEMENTS)==100
          assert abs(m.RETRACEMENTS[0]-0.01)<1e-12
          assert abs(m.RETRACEMENTS[-1]-1.0)<1e-12
          assert len(m.configurations())==100
          print("Validated 100 retracement-only configurations: 0.01..1.000")
          PY
  backtest:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
        timeframe: [5m, 15m, 30m, 1h, 2h, 4h]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mtf-top100-two-year
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent 100-point three-year retracement sweep
        run: |
          python research/retracement_1000_three_year_backtest.py \
            --symbol "${{ matrix.symbol }}" \
            --timeframe "${{ matrix.timeframe }}" \
            --data-dir /tmp/binance \
            --output-dir research-output
      - name: Verify complete outputs
        run: |
          test -s research-output/${{ matrix.symbol }}_${{ matrix.timeframe }}_manifest.json
          test -s research-output/${{ matrix.symbol }}_${{ matrix.timeframe }}_all_config_metrics.csv
          python - <<'PY'
          import csv, os
          p=f'research-output/{os.environ["SYMBOL"]}_{os.environ["TF"]}_all_config_metrics.csv'
          with open(p,newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==100, f'expected 100 configs, got {len(rows)}'
          PY
        env:
          SYMBOL: ${{ matrix.symbol }}
          TF: ${{ matrix.timeframe }}
      - uses: actions/upload-artifact@v4
        with:
          name: retracement-${{ matrix.symbol }}-${{ matrix.timeframe }}
          path: research-output/
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mtf-top100-two-year
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: retracement-*
          path: research-output
          merge-multiple: true
      - name: Print ranked retracement results in workflow log
        run: python research/aggregate_retracement_1000.py
