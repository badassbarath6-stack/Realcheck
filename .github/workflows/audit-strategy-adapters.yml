name: Verify Audited Strategy Adapters
on:
  push:
    branches:
      - research/100-mechanism-audit-import
    paths:
      - "research/engine-audit/**"
      - ".github/workflows/audit-strategy-adapters.yml"
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/research -p "test_audited_strategies.py" -v
