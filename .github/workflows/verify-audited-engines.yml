name: Verify audited engine ports
on:
  push:
    branches:
      - research/100-mechanism-audit-import
    paths:
      - "research/engine_audit/**"
      - "tests/research/test_audited_engine_ports.py"
      - ".github/workflows/verify-audited-engines.yml"
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run audited engine unit tests
        run: python -m unittest discover -s tests/research -p 'test_audited_engine_ports.py' -v
