name: Model 3-100 BTC two-year historical backtest
on:
  push:
    paths:
      - 'backtest/**'
      - 'Model_3-100_Google_Apps_Script.gs'
      - '.github/workflows/model3-100-backtest.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: model3-100-two-year-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run source-pinned historical replay
        run: |
          python backtest/model3_100_backtest.py
      - name: Upload verified results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model3-100-btc-2024-11-16-to-2026-11-16
          path: |
            summary.json
            trades.csv
            per_config.csv
          if-no-files-found: warn
          retention-days: 90
