name: Impulse Retracer Research Sweep
on:
  push:
    branches:
      - research/mtf-top100-two-year
    paths:
      - "research/**"
      - "tests/research/**"
      - ".github/workflows/impulse-retracer-research.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
        timeframe: [5m, 15m, 30m, 1h, 2h, 4h]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/mtf-top100-two-year
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify research core
        run: python -m unittest discover -s tests/research -v
      - name: Run independent pair
        run: |
          python research/impulse_retracer_backtest.py --symbol "${{ matrix.symbol }}" --timeframe "${{ matrix.timeframe }}" --data-dir /tmp/binance --output-dir research-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impulse-research-${{ matrix.symbol }}-${{ matrix.timeframe }}
          path: research-output/
          if-no-files-found: warn
          retention-days: 30
