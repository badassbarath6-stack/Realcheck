name: Model 3-100 five-year Binance Futures SL-TP backtest

on:
  push:
    paths:
      - "backtest/model3_100_five_year_sl_tp.py"
      - ".github/workflows/model3-100-five-year-sl-tp-backtest.yml"
      - "Model_3-100_Google_Apps_Script.gs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model3-100-five-year-sl-tp-backtest
  cancel-in-progress: false

jobs:
  five-year-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Model 3-100
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.2.6
      - name: Validate five-year backtest code
        run: python -m py_compile backtest/model3_100_five_year_sl_tp.py
      - name: Run five-year BTCUSDT USD-M Futures backtest
        run: python backtest/model3_100_five_year_sl_tp.py --start 2021-11-19 --end 2026-11-19
      - name: Upload five-year research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model3-100-five-year-sl-tp-results
          path: backtest-results/
          if-no-files-found: warn
          retention-days: 30
