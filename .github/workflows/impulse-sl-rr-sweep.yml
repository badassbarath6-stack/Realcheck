name: Config 1 Impulse Entry - SL ATR and RR Sweep
on:
  push:
    branches:
      - research/impulse-sl-rr-sweep
    paths:
      - "research/impulse_sl_rr_backtest.py"
      - "research/aggregate_impulse_sl_rr.py"
      - ".github/workflows/impulse-sl-rr-sweep.yml"
  workflow_dispatch:
concurrency:
  group: impulse-sl-rr-sweep
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/impulse-sl-rr-sweep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical runtime
        run: pip install numpy numba
      - name: Compile and validate grid
        run: |
          python -m py_compile research/impulse_sl_rr_backtest.py research/aggregate_impulse_sl_rr.py
          python - <<'PY'
          import sys
          sys.path.insert(0,"research")
          import impulse_sl_rr_backtest as m
          assert len(m.SL_VALUES)==46 and m.SL_VALUES[0]==0.5 and m.SL_VALUES[-1]==5.0
          assert len(m.RR_VALUES)==23 and m.RR_VALUES[0]==0.5 and m.RR_VALUES[-1]==6.0
          assert len(m.SL_VALUES)*len(m.RR_VALUES)==1058
          assert m.IMPULSE_ATR=={"5m":5.0,"15m":5.0,"30m":5.0,"1h":2.6,"2h":2.6,"4h":2.6}
          # Numba smoke test: a long trade reaches its target; stop/target execution path compiles.
          import numpy as np
          t=np.array([0,60000,120000,180000],dtype=np.float64)
          o=np.array([100.,100.,100.,102.]);h=np.array([100.,101.,103.,102.])
          l=np.array([100.,99.9,100.,102.]);c=np.array([100.,100.,102.,102.])
          ev=np.array([[0.,1.,1.]])
          z=m.simulate_grid(t,o,h,l,c,ev,np.array([1.]),np.array([2.]),120000,180000,5.,2.,7.)
          assert z.shape==(1,3,9)
          print("Validated 1,058 configurations per asset/timeframe and Numba simulation.")
          PY
  backtest:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        symbol: [BTCUSDT, ETHUSDT]
        timeframe: [5m, 15m, 30m, 1h, 2h, 4h]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/impulse-sl-rr-sweep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numerical runtime
        run: pip install numpy numba
      - name: Run all SL and RR combinations
        run: |
          python research/impulse_sl_rr_backtest.py --symbol "${{ matrix.symbol }}" --timeframe "${{ matrix.timeframe }}" --data-dir /tmp/binance --output-dir research-output
      - name: Verify complete outputs
        run: |
          python - <<'PY'
          import csv,json,os
          sym,tf=os.environ["SYMBOL"],os.environ["TF"]
          root="research-output"
          m=json.load(open(f"{root}/{sym}_{tf}_sl_rr_manifest.json"))
          assert m["configurations"]==1058 and m["m1_gap_count"]==0
          with open(f"{root}/{sym}_{tf}_sl_rr_all.csv",newline="") as f: rows=list(csv.DictReader(f))
          assert len(rows)==1058
          assert len({(float(r["sl_atr"]),float(r["rr"])) for r in rows})==1058
          assert {float(r["impulse_atr_minimum"]) for r in rows}=={m["impulse_atr_minimum"]}
          print(f"Verified {sym} {tf}: {len(rows)} unique configurations.")
          PY
        env:
          SYMBOL: ${{ matrix.symbol }}
          TF: ${{ matrix.timeframe }}
      - uses: actions/upload-artifact@v4
        with:
          name: impulse-sl-rr-${{ matrix.symbol }}-${{ matrix.timeframe }}
          path: research-output/
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/impulse-sl-rr-sweep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all pair/timeframe results
        uses: actions/download-artifact@v4
        with:
          pattern: impulse-sl-rr-*
          path: research-output
          merge-multiple: true
      - name: Verify 12 datasets and aggregate
        run: python research/aggregate_impulse_sl_rr.py
