name: Five Year Crypto Futures Source Backtests
on:
  push:
    branches:
      - research/crypto-5y-source-backtests
    paths:
      - "research/engine_audit/run_1000_source_five_year.py"
      - "research/engine_audit/download_binance_vision_futures.py"
      - "research/engine_audit/offline_freqtrade_cli.py"
      - ".github/workflows/crypto-five-year-source-backtests.yml"
permissions:
  contents: read
  actions: read
jobs:
  five-year-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-5y-source-backtests
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve verified 1,000-source harvest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/harvest-download source-harvest
          gh run download 45023349418 --repo badassbarath6-stack/Realcheck --name strategy-source-harvest-1000 --dir /tmp/harvest-download
          cp -a /tmp/harvest-download/. source-harvest/
          test "$(find source-harvest/sources -type f | wc -l)" -eq 1000
          test -f source-harvest/manifest.csv
      - name: Install native Freqtrade runtime
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install freqtrade
          freqtrade --version
      - name: Build five years of local futures candles from checksum-verified Binance Vision archives
        run: |
          python -m pip install --upgrade pyarrow
          python research/engine_audit/download_binance_vision_futures.py
          test -s five-year-results/data_manifest.json
          find user_data/data/binance/futures -type f -name '*.feather' | sort
      - name: Run source-by-source native strategy backtests
        run: |
          python research/engine_audit/run_1000_source_five_year.py
      - name: Verify and publish results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-five-year-source-backtest-results
          path: |
            five-year-results/
            user_data/backtest_results/
          if-no-files-found: warn
          retention-days: 90
