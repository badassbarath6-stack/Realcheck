name = "impulse-retracer"
main = "src/worker.js"
compatibility_date = "2026-11-20"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "STATE"
class_name = "ImpulseState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ImpulseState"]

[vars]
SYMBOLS = "BTCUSDT,ETHUSDT"
BINANCE_API_BASE = "https://fapi.binance.com"

[observability]
enabled = true
